<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCT3 OVL Viewer</title>
<style>
  :root {
    --bg: #15171c; --panel: #1d2027; --panel2: #252932; --line: #333845; --text: #dfe3ea; --dim: #8a92a3;
    --accent: #f2a93b; --sel: #2f3a52; --err: #e66;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  #app { display: grid; grid-template-columns: var(--c1, 300px) var(--c2, 320px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100vh; overflow: hidden; }
  .col { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--line); background: var(--panel); }
  .head { padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel2); }
  .head h1 { margin: 0; font-size: 15px; color: var(--accent); letter-spacing: .3px; white-space: nowrap; }
  .head .sub { color: var(--dim); font-size: 12px; }
  input[type=search] { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); outline: none; }
  input[type=search]:focus { border-color: var(--accent); }
  .scroll { overflow: auto; flex: 1; min-height: 0; }
  .tree details { padding-left: 12px; }
  .tree summary { cursor: pointer; padding: 2px 4px; color: var(--dim); list-style: none; white-space: nowrap; }
  .tree summary::before { content: "▸ "; } .tree details[open] > summary::before { content: "▾ "; }
  .tree .ovl { padding: 2px 4px 2px 22px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 4px; }
  .tree .ovl:hover, .res:hover { background: var(--panel2); }
  .tree .ovl.sel, .res.sel { background: var(--sel); }
  .tree .ovl.gfile .gi { display: inline-block; width: 1.3em; text-align: center; color: var(--accent); }
  #doc .gf-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  #doc .gf-btns button { font-weight: 600; } #doc .gf-btns button.main { background: var(--accent); color: #111; border-color: var(--accent); }
  #doc .gf-sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; border: 1px solid #fff3; }
  #doc .gf-draw { background: #05070c; border-radius: 8px; display: block; width: 100%; max-width: 420px; aspect-ratio: 1; }
  .badge { display: inline-block; font-size: 10px; padding: 0 5px; border-radius: 8px; margin-left: 4px; background: #333a48; color: var(--dim); }
  .b-shs { background: #2b4a3a; color: #9fe0b8; } .b-tex { background: #4a3b2b; color: #f2c58a; } .b-snd { background: #2b3b4a; color: #9fc8f0; }
  .group { padding: 8px 12px 2px; color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .group small { color: var(--dim); text-transform: none; letter-spacing: 0; }
  .group .help { float: right; cursor: pointer; color: var(--dim); border: 1px solid var(--line); border-radius: 50%; width: 16px; height: 16px;
    line-height: 14px; text-align: center; font-size: 10px; text-transform: none; }
  #doc h2 .help { display: inline-block; color: var(--dim); border: 1px solid var(--line); border-radius: 50%; width: 18px; height: 18px;
    line-height: 16px; text-align: center; font-size: 11px; text-decoration: none; vertical-align: 3px; }
  #doc h2 .help:hover { color: var(--accent); border-color: var(--accent); }
  .group .help:hover { color: var(--accent); border-color: var(--accent); }
  .head .brand { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .head .brand .sub { margin-left: auto; }
  #b-tour { font-size: 11px; padding: 2px 8px; }
  /* the four tabs: one even row (wraps to two when the column is narrow) */
  .tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 8px 0 6px;
          padding: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  .head { container-type: inline-size; }
  /* narrow: 3 on top, 2 below (spanning 2 of 6 / 3 of 6 columns); wide: all 5 in one row */
  .tabs button { grid-column: span 2; }   /* narrow: 3 per row, two rows; wide: all 6 in one row */
  @container (min-width: 520px) { .tabs button { grid-column: span 1; } }
  .subgroup { padding: 6px 12px 1px 18px; color: var(--dim); font-size: 11px; letter-spacing: .3px; }
  .subgroup small { opacity: .7; }
  #rootinfo { overflow-wrap: anywhere; }
  .tabs button { border: 0; background: transparent; padding: 5px 4px; font-size: 12px; color: var(--dim);
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 6px; }
  .tabs button:hover { color: var(--text); background: var(--panel2); }
  .tabs button.active { color: var(--accent); background: var(--sel); box-shadow: inset 0 0 0 1px var(--accent); }
  /* drag handles on the right edge of the two list columns */
  .resizer { position: absolute; top: 0; right: -4px; width: 8px; height: 100%; cursor: col-resize; z-index: 20; }
  .resizer::after { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 2px; background: transparent; transition: background .15s; }
  .resizer:hover::after, .resizer.drag::after { background: var(--accent); }
  body.resizing { cursor: col-resize; user-select: none; } body.resizing #stage { pointer-events: none; }
  /* file type guide */
  #doc.guide { padding: 20px 28px 60px; line-height: 1.55; }
  #doc.guide .md { max-width: 900px; }
  #doc.guide h1 { font-size: 20px; color: var(--accent); margin: 0 0 12px; }
  #doc.guide h2 { font-size: 16px; color: var(--accent); margin: 30px 0 8px; padding-top: 6px; border-top: 1px solid var(--line); }
  #doc.guide h3 { font-size: 14px; margin: 20px 0 6px; padding: 6px 10px; background: var(--panel); border-left: 3px solid var(--accent); border-radius: 4px; scroll-margin-top: 64px; }
  #doc.guide h3.hl { background: var(--sel); }
  #doc.guide code { font: 12px ui-monospace, Consolas, monospace; background: var(--panel2); padding: 1px 4px; border-radius: 4px; }
  #doc.guide table { border-collapse: collapse; margin: 8px 0 14px; width: 100%; font-size: 12.5px; }
  #doc.guide th, #doc.guide td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  #doc.guide th { background: var(--panel2); }
  #doc.guide ul { margin: 4px 0 8px; padding-left: 22px; } #doc.guide li { margin: 2px 0; }
  #doc.guide a { color: var(--accent); }
  #doc.guide .tfilter { position: sticky; top: -20px; background: var(--bg); padding: 8px 0; z-index: 1; display: flex; gap: 8px; }
  #doc.guide .tfilter input { max-width: 340px; }
  .res { padding: 3px 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res.dim { color: var(--dim); cursor: default; }
  #view { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  #toolbar { display: flex; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel2); flex-wrap: wrap; }
  #toolbar .title { font-weight: 600; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toolbar .grp { display: none; gap: 6px; align-items: center; }
  button, select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; font: inherit; }
  select { max-width: 220px; }
  button:hover { border-color: var(--accent); } button.on { background: var(--sel); border-color: var(--accent); }
  input[type=color] { width: 30px; height: 26px; padding: 0 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #stage { overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #img { position: absolute; inset: 0; display: none; overflow: hidden; cursor: grab; touch-action: none; user-select: none;
    background: repeating-conic-gradient(#2a2d35 0 25%, #20232a 0 50%) 50% / 20px 20px; }
  #img.dragging { cursor: grabbing; }
  #img img { position: absolute; left: 0; top: 0; transform-origin: 0 0; image-rendering: pixelated; box-shadow: 0 0 0 1px #000a;
    max-width: none; max-height: none; pointer-events: none; -webkit-user-drag: none; }
  #zoompct { min-width: 52px; text-align: center; color: var(--dim); font-variant-numeric: tabular-nums; }
  #doc { position: absolute; inset: 0; display: none; overflow: auto; padding: 16px 20px; background: var(--bg); }
  #doc pre { font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word; color: #c9d1dc; margin: 0; }
  #doc table.t { border-collapse: collapse; width: 100%; }
  #doc table.t td { border-bottom: 1px solid var(--line); padding: 4px 8px; vertical-align: top; }
  #doc table.t td:first-child { color: var(--dim); white-space: nowrap; font-family: ui-monospace, Consolas, monospace; font-size: 12px; width: 1%; }
  #doc audio { width: min(520px, 100%); margin: 12px 0; }
  #doc h2 { font-size: 15px; margin: 0 0 10px; color: var(--accent); }
  #doc .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  #info { position: absolute; left: 10px; bottom: 10px; max-width: 46%; max-height: 45%; overflow: auto; font-size: 12px;
    background: #0e1014cc; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: none; }
  #info table { border-collapse: collapse; } #info td { padding: 1px 8px 1px 0; color: var(--dim); } #info td:first-child { color: var(--text); white-space: nowrap; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); pointer-events: none; text-align: center; padding: 20px; }
  .err { color: var(--err) !important; }
  @media (max-width: 900px) { #app { grid-template-columns: 1fr; grid-template-rows: 30vh 25vh 1fr; } .col { border-right: 0; border-bottom: 1px solid var(--line); } .resizer { display: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }

<body>
<div id="app">
  <div class="col">
    <div class="head">
      <div class="brand"><h1>RCT3 OVL Viewer</h1><span class="sub">by K3rn</span><button id="b-tour" title="A guided walkthrough of the whole program">? Tour</button></div>
      <nav class="tabs">
        <button id="b-types" title="What every file type is and does">File types</button>
        <button id="b-people" title="Whole guests, staff and entertainers">Peeps</button>
        <button id="b-rides" title="Flat rides with their ride animations">Thrill Rides</button>
        <button id="b-designs" title="The game's premade roller coaster and tracked ride designs, built from their track pieces">Ride Designs</button>
        <button id="b-scenery" title="Every scenery item's 3D model: trees, walls, animatronics, path extras, stalls… with their animations">Scenery</button>
        <button id="b-fireworks" title="Fireworks show editor: the game's firework displays and fireworks, simulated in 3D (opens full window)">Fireworks</button>
      </nav>
      <div class="sub" id="rootinfo">loading…</div>
      <input id="treefilter" type="search" placeholder="Filter OVLs (e.g. coaster, chess)" style="margin-top:8px"></div>
    <div class="scroll tree" id="tree"></div>
    <div class="resizer" data-col="1" title="Drag to resize · double-click to reset"></div>
  </div>
  <div class="col">
    <div class="head"><div id="ovltitle" style="font-weight:600">No OVL selected</div><div class="sub" id="ovlsub"></div>
      <input id="resfilter" type="search" placeholder="Filter resources" style="margin-top:8px"></div>
    <div class="scroll" id="res"></div>
    <div class="resizer" data-col="2" title="Drag to resize · double-click to reset"></div>
  </div>
  <div id="view">
    <div id="toolbar">
      <span class="title" id="vtitle">Pick anything in an OVL</span>
      <span class="grp" id="g-anim"><select id="anim" title="Animation"></select><button id="b-play" class="on" title="Play / pause">Play</button></span>
      <span class="grp" id="g-hold" title="What the peep is eating or drinking in this animation"><select id="hold"></select></span>
      <span class="grp" id="g-outfit" title="Colour variant: the texture holds several (outfits, mallard / plain duck, ...)"><select id="outfit"></select></span>
      <span class="grp" id="g-zoom" title="Scroll to zoom, drag to move, double-click to fit"><button id="z-out" title="Zoom out (-)">−</button><span id="zoompct">100%</span><button id="z-in" title="Zoom in (+)">+</button><button id="z-fit" title="Fit to window (0)">Fit</button><button id="z-1" title="Actual pixels (1)">1:1</button></span>
      <span class="grp" id="g-3d" style="display:flex">
      <button id="b-wire" title="Wireframe">Wireframe</button>
      <button id="b-bones" title="Show skeleton">Bones</button>
      <button id="b-grid" class="on" title="Ground grid">Grid</button>
      <button id="b-spin" title="Auto rotate">Spin</button>
      <select id="bg" title="Background"><option value="#20232a">Dark</option><option value="#7a8494">Grey</option><option value="#cfd6e0">Light</option></select>
      <button id="b-rotx" title="Turn the model 90° forwards (e.g. stand up an elevator car, which the game stores lying down)">Rotate X</button>
      <button id="b-rotz" title="Turn the model 90° sideways">Rotate Z</button>
      <button id="b-reset" title="Reset camera and rotation">Reset</button></span>
      <button id="b-dl" title="Download the current file">Download</button>
    </div>
    <div id="stage"><div id="img"><img id="imgel" alt=""></div><div id="doc"></div><div id="info"></div><div id="msg">Loading game index…</div></div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $ = id => document.getElementById(id);
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#20232a');
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x445066, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(3, 6, 4); scene.add(sun);
let grid = new THREE.GridHelper(20, 20, 0x556070, 0x343a46); scene.add(grid);
let current = null, skel = null, dlUrl = null, dlName = null, wire = false;
let mixer = null, clips = [], action = null, playing = true;
const clock = new THREE.Clock();

function resize() { const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();
const viewerLoop = () => { const dt = clock.getDelta(); if (mixer && playing) mixer.update(dt); controls.update(); renderer.render(scene, camera); };
renderer.setAnimationLoop(viewerLoop);

let gridTile = 0;   // 4 for ride designs: draw RCT3 tiles
function frame(obj) {
  const box = new THREE.Box3().setFromObject(obj, true);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.length() / 2, 0.01);
  controls.target.copy(c);
  camera.near = r / 100; camera.far = r * 100; camera.updateProjectionMatrix();
  camera.position.copy(c).add(new THREE.Vector3(1, 0.7, 1.4).normalize().multiplyScalar(r * 2.8));
  scene.remove(grid);
  if (gridTile) {   // ride designs: the park's 4 m tiles, covering the ride (designs.py puts tile edges on multiples of 4 m)
    const n = 2 * Math.ceil((Math.max(Math.abs(box.min.x), box.max.x, Math.abs(box.min.z), box.max.z) + gridTile) / gridTile);
    grid = new THREE.GridHelper(n * gridTile, n, 0x556070, 0x343a46);
  } else { const step = Math.pow(10, Math.floor(Math.log10(r))); grid = new THREE.GridHelper(step * 20, 20, 0x556070, 0x343a46); }
  grid.position.y = box.min.y; grid.visible = $('b-grid').classList.contains('on'); scene.add(grid);
}
function clearModel() {
  if (mixer) mixer.stopAllAction(); mixer = null; action = null; clips = []; heldObj = null; heldKey = ''; grp('g-hold', false);
  if (current) { scene.remove(current); current.traverse(o => { o.geometry?.dispose(); [].concat(o.material || []).forEach(m => { m.map?.dispose(); m.dispose(); }); }); }
  if (skel) scene.remove(skel); current = skel = null;
}
function msg(t, err) { $('msg').textContent = t || ''; $('msg').className = err ? 'err' : ''; }
function info(rows) { const el = $('info'); if (!rows) { el.style.display = 'none'; return; } el.innerHTML = '<table>' + rows.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('') + '</table>'; el.style.display = 'block'; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const grp = (id, on) => $(id).style.display = on ? 'flex' : 'none';
function mode(m) {   // '3d' | 'img' | 'doc'
  renderer.domElement.style.visibility = m === '3d' ? 'visible' : 'hidden';
  $('img').style.display = m === 'img' ? 'flex' : 'none';
  $('doc').style.display = m === 'doc' ? 'block' : 'none'; $('doc').classList.remove('guide');
  grp('g-3d', m === '3d'); if (m !== '3d') { grp('g-anim', false); grp('g-outfit', false); grp('g-hold', false); clearModel(); }
  grp('g-zoom', m === 'img');
}

// ---- picture zoom / pan: wheel zooms at the cursor, drag moves, double-click fits -------------------------------
const zoom = { s: 1, x: 0, y: 0, w: 0, h: 0, fit: true, key: '' };
function zoomApply() {
  $('imgel').style.transform = `translate(${zoom.x}px, ${zoom.y}px) scale(${zoom.s})`;
  $('zoompct').textContent = (zoom.s >= 10 ? Math.round(zoom.s * 100) : +(zoom.s * 100).toFixed(zoom.s < 0.1 ? 1 : 0)) + '%';
}
function zoomFit() {
  const r = $('img').getBoundingClientRect(); if (!zoom.w || !r.width) return;
  zoom.s = Math.min((r.width * 0.92) / zoom.w, (r.height * 0.92) / zoom.h, 8);   // small icons up to 8x
  zoom.x = (r.width - zoom.w * zoom.s) / 2; zoom.y = (r.height - zoom.h * zoom.s) / 2; zoom.fit = true; zoomApply();
}
function zoomTo(s, cx, cy) {   // new scale, keeping the picture point under (cx, cy) in place
  const r = $('img').getBoundingClientRect(); if (cx === undefined) { cx = r.width / 2; cy = r.height / 2; }
  s = Math.min(64, Math.max(0.02, s));
  zoom.x = cx - (cx - zoom.x) * (s / zoom.s); zoom.y = cy - (cy - zoom.y) * (s / zoom.s); zoom.s = s; zoom.fit = false; zoomApply();
}
function zoomLoaded(w, h, key) {   // new picture: fit it, unless it's the same picture again (e.g. recoloured)
  const same = key === zoom.key && w === zoom.w && h === zoom.h;
  zoom.w = w; zoom.h = h; zoom.key = key;
  $('imgel').style.width = w + 'px'; $('imgel').style.height = h + 'px';
  if (!same || zoom.fit) zoomFit(); else zoomApply();
}
$('img').addEventListener('wheel', e => {
  e.preventDefault(); const r = $('img').getBoundingClientRect();
  zoomTo(zoom.s * Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0015)), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
let drag = null;
$('img').addEventListener('pointerdown', e => { if (e.button !== 0) return; drag = { px: e.clientX, py: e.clientY, x: zoom.x, y: zoom.y };
  $('img').setPointerCapture(e.pointerId); $('img').classList.add('dragging'); });
$('img').addEventListener('pointermove', e => { if (!drag) return;
  zoom.x = drag.x + e.clientX - drag.px; zoom.y = drag.y + e.clientY - drag.py; zoom.fit = false; zoomApply(); });
const endDrag = () => { drag = null; $('img').classList.remove('dragging'); };
$('img').addEventListener('pointerup', endDrag); $('img').addEventListener('pointercancel', endDrag);
$('img').addEventListener('dblclick', zoomFit);
$('z-in').onclick = () => zoomTo(zoom.s * 1.5); $('z-out').onclick = () => zoomTo(zoom.s / 1.5);
$('z-fit').onclick = zoomFit; $('z-1').onclick = () => zoomTo(1);
new ResizeObserver(() => { if (zoom.fit && $('img').style.display !== 'none') zoomFit(); }).observe($('img'));
document.addEventListener('keydown', e => {
  if ($('img').style.display === 'none' || /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || '')) return;
  if (e.key === '+' || e.key === '=') zoomTo(zoom.s * 1.5); else if (e.key === '-') zoomTo(zoom.s / 1.5);
  else if (e.key === '0') zoomFit(); else if (e.key === '1') zoomTo(1);
});
function setDownload(blob, name) { if (dlUrl) URL.revokeObjectURL(dlUrl); dlUrl = blob ? URL.createObjectURL(blob) : null; dlName = name; }

// ---- tree ------------------------------------------------------------------------------------------------
let ovls = [], selOvl = null, tracksets = [], gameFiles = [];
// the loose firework files beside the OVLs (fireworks, particle effects, shows, lasers, water jets, laser drawings, music)
const GF = { firework: ['🎆', 'Firework'], effect: ['✨', 'Particle effect'], show: ['🎇', 'Firework show (MixMaster display)'],
  laser: ['✳', 'Laser'], jet: ['⛲', 'Water jet'], drawing: ['✎', 'Laser drawing'], music: ['♪', 'Music'] };
async function loadTree() {
  const t = await (await fetch('/api/tree')).json();
  ovls = t.ovls; gameFiles = t.files || [];
  $('rootinfo').textContent = `${ovls.length} OVL pairs · ${gameFiles.length} firework files · ${t.root}`;
  renderTree(''); msg('Pick an OVL on the left, or a tab: Peeps, Thrill Rides, Ride Designs, Scenery, Fireworks');
  // track pieces per ride arrive a moment later (the first time, the server scans the track files)
  fetch('/api/tracksets').then(r => r.json()).then(s => { tracksets = s; renderTree($('treefilter').value); }).catch(() => {});
}
function renderTree(filter) {
  const f = filter.toLowerCase(), root = {};
  for (const o of ovls) {
    if (f && !o.path.toLowerCase().includes(f)) continue;
    const parts = o.path.split(/[\\/]/); let node = root;
    for (const p of parts.slice(0, -1)) node = (node[p + '/'] ??= {});
    node[parts.at(-1)] = o;
  }
  // each tracked ride's folder gets an entry with exactly its track pieces (the game keeps them in shared
  // tracks\coasters\TrackNN files, which the ride record points to)
  for (const s of tracksets) {
    const label = `${s.title} track pieces`;
    if (f && !(s.folder + '\\' + label).toLowerCase().includes(f)) continue;
    let node = root;
    for (const p of s.folder.split(/[\\/]/)) node = (node[p + '/'] ??= {});
    node['\u0000' + label] = { path: 'trackset:' + s.ride, trackset: s, counts: { tks: s.count } };
  }
  for (const g of gameFiles) {
    if (f && !(g.path + ' ' + g.type).toLowerCase().includes(f)) continue;
    const parts = g.path.split(/[\\/]/); let node = root;
    for (const p of parts.slice(0, -1)) node = (node[p + '/'] ??= {});
    node[parts.at(-1)] = { path: 'file:' + g.path, gfile: g };
  }
  const html = (node, depth) => Object.keys(node).sort((a, b) => (b.endsWith('/') - a.endsWith('/')) || a.localeCompare(b)).map(k => {
    const v = node[k];
    if (k.endsWith('/')) return `<details${f || depth < 1 ? ' open' : ''}><summary>${esc(k.slice(0, -1))}</summary>${html(v, depth + 1)}</details>`;
    if (v.gfile) return `<div class="ovl gfile${selOvl === v.path ? ' sel' : ''}" data-p="${esc(v.path)}" title="${esc(GF[v.gfile.type][1])} · ${(v.gfile.size / 1024).toFixed(0)} KB${v.gfile.custom ? ' · made with this program' : ''}"><span class="gi">${GF[v.gfile.type][0]}</span> ${esc(k)}${v.gfile.custom ? '<span class="badge b-tex">yours</span>' : ''}</div>`;
    if (v.trackset) return `<div class="ovl trackset${selOvl === v.path ? ' sel' : ''}" data-p="${esc(v.path)}" title="Pieces from ${esc(v.trackset.track_ovls.join(', '))}">🛤 ${esc(k.slice(1))}<span class="badge b-shs">${v.trackset.count}</span></div>`;
    const c = v.counts || {}, m = (c.shs || 0) + (c.bsh || 0) + (c.mms || 0) + (c.ssk || 0), x = (c.tex || 0) + (c.ftx || 0), s = c.snd || 0;
    return `<div class="ovl${selOvl === v.path ? ' sel' : ''}" data-p="${esc(v.path)}" title="${esc(v.path)} · v${v.version}">${esc(k)}${m ? `<span class="badge b-shs">${m}</span>` : ''}${x ? `<span class="badge b-tex">${x}</span>` : ''}${s ? `<span class="badge b-snd">♪${s}</span>` : ''}${v.error ? '<span class="badge err">!</span>' : ''}</div>`;
  }).join('');
  $('tree').innerHTML = html(root, 0);
}
